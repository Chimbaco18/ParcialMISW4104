<div class="container py-5" *ngIf="repo">
  <div class="mb-4">
    <a (click)="goBack()" class="text-primary text-decoration-none fw-medium pointer" style="cursor: pointer;">
      <i class="bi bi-arrow-left me-2"></i>Back to repositories
    </a>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
        <div class="p-5">
          <div class="d-flex align-items-center mb-0">
            <div class="bg-primary bg-opacity-10 p-2 rounded me-3">
              <i class="bi bi-journal-code text-primary fs-4"></i>
            </div>
            <span class="badge bg-light text-muted border">ID: {{repo.id}}</span>
          </div>
          
          <h1 class="fw-bold display-5 mb-4 text-dark">{{repo.name}}</h1>
          
          <p class="text-secondary fs-5 leading-relaxed mb-4">
            {{repo.description}}. 
          </p>

          <hr class="my-4 opacity-25">

          <div class="row g-4 mt-2">
            <div class="col-sm-6 col-md-3">
              <div class="p-3 border rounded-3 bg-light bg-opacity-50">
                <small class="text-muted d-block text-uppercase fw-bold mb-1" style="font-size: 0.7rem;">Language</small>
                <div class="d-flex align-items-center">
                  <span class="badge bg-primary rounded-pill px-3">{{repo.language}}</span>
                </div>
              </div>
            </div>
            
            <div class="col-sm-6 col-md-3">
              <div class="p-3 border rounded-3 bg-light bg-opacity-50">
                <small class="text-muted d-block text-uppercase fw-bold mb-1" style="font-size: 0.7rem;">Stars</small>
                <div class="fw-bold fs-5 text-dark"><i class="bi bi-star-fill text-warning me-1"></i>{{repo.stars}}</div>
              </div>
            </div>

            <div class="col-sm-6 col-md-3">
              <div class="p-3 border rounded-3 bg-light bg-opacity-50">
                <small class="text-muted d-block text-uppercase fw-bold mb-1" style="font-size: 0.7rem;">Created At</small>
                <div class="fw-medium text-dark">{{repo.createdAt | date:'yyyy-MM-dd'}}</div>
              </div>
            </div>

            <div class="col-sm-6 col-md-3">
              <div class="p-3 border rounded-3 bg-light bg-opacity-50">
                <small class="text-muted d-block text-uppercase fw-bold mb-1" style="font-size: 0.7rem;">Owner ID</small>
                <div class="fw-medium text-dark">#{{repo.ownerId}}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden" *ngIf="owner">
        <div class="bg-gradient-header" style="height: 100px;"></div>
        
        <div class="card-body text-center pt-0 mb-4" style="margin-top: -50px;">
          <img [src]="owner.avatarUrl" 
               class="rounded-4 border border-4 border-white shadow-sm mb-4" 
               width="100" height="100" 
               style="object-fit: cover;">
          
          <h4 class="fw-bold mb-1 text-dark">{{owner.name}}</h4>
          <p class="text-primary fw-medium mb-3">@{{owner.username}}</p>
          
          <hr class="my-3 opacity-25">
          
          <div class="text-start px-2 mb-4">
            <div class="d-flex align-items-center mb-3 small text-secondary">
              <i class="bi bi-envelope-at fs-5 me-3 text-primary"></i>
              <span>{{owner.email}}</span>
            </div>
          </div>


        </div>
      </div>

    </div>
  </div>
</div>
